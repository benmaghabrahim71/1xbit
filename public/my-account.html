<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account — HOST1TOP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      background: #f8f9fa;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .auth-page {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
    }

    .auth-container {
      width: 100%;
      max-width: 1000px;
      background: #ffffff;
      border-radius: 1rem;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0, 0, 0, 0.05);
      display: grid;
      grid-template-columns: 1fr;
      overflow: hidden;
    }

    @media (min-width: 768px) {
      .auth-container {
        grid-template-columns: 1fr 1px 1fr;
      }

      .auth-divider {
        background: #eee;
        height: 80%;
        align-self: center;
      }
    }

    .auth-col {
      padding: 3rem;
    }

    .auth-col h2 {
      font-size: 2.25rem;
      font-weight: 800;
      margin: 0 0 2rem;
      color: #000;
    }

    .form-group {
      margin-bottom: 1.5rem;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #444;
    }

    .form-group label .required {
      color: #ef4444;
      margin-left: 0.2rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.85rem 1.25rem;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 999px;
      font-size: 1rem;
      transition: all 0.3s ease;
      color: #000;
    }

    .form-group input:focus {
      outline: none;
      border-color: #000;
      box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.05);
    }

    .btn-auth {
      display: inline-block;
      width: fit-content;
      min-width: 160px;
      padding: 0.75rem 1.5rem;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-auth:hover {
      background: #333;
      transform: translateY(-1px);
    }

    .google-auth {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1.25rem;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #555;
      text-decoration: none;
      width: fit-content;
      margin-bottom: 2rem;
      transition: background 0.2s;
    }

    .google-auth:hover {
      background: #f9f9f9;
    }

    .google-auth img {
      width: 18px;
      height: 18px;
    }

    .lost-password {
      color: #666;
      text-decoration: none;
      font-weight: 500;
      margin-top: 1.5rem;
      display: block;
    }

    .lost-password:hover {
      color: #000;
      text-decoration: underline;
    }

    .password-input-wrapper {
      position: relative;
    }

    .password-toggle {
      position: absolute;
      right: 1.25rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      padding: 0;
      display: flex;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
    }

    .checkbox-group input {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 1rem;
    }

    .modal-content {
      background: #fff;
      padding: 2.5rem;
      border-radius: 1rem;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #999;
    }
  </style>

  <meta name="description" content="HOST1TOP — Premium 10Gb/s Game & Cloud Hosting. SA-MP, MTA:SA, Minecraft, RDP and VPS hosting with 99.9% uptime." />
  <meta name="keywords" content="hosting, vps, rdp, game server, minecraft hosting, samp hosting, cloud hosting, 10Gbps, host1top, premium hosting" />
  <meta name="author" content="HOST1TOP" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://host1top.com/" />
  <meta property="og:title" content="HOST1TOP — Integrity, Efficiency, and Speed 10Gb/s" />
  <meta property="og:description" content="Premium 10Gb/s Game & Cloud Hosting. SA-MP, MTA:SA, Minecraft, RDP and VPS hosting with 99.9% uptime." />
  <meta property="og:image" content="https://host1top.com/img/og-image.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://host1top.com/" />
  <meta name="twitter:title" content="HOST1TOP — Integrity, Efficiency, and Speed 10Gb/s" />
  <meta name="twitter:description" content="Premium 10Gb/s Game & Cloud Hosting. SA-MP, MTA:SA, Minecraft, RDP and VPS hosting with 99.9% uptime." />
  <meta name="twitter:image" content="https://host1top.com/img/og-image.jpg" />
  <link rel="canonical" href="https://host1top.com/" />
</head>

<body>
  <div id="header-root"></div>

  <main class="auth-page">
    <div class="auth-container">
      <!-- Login Column -->
      <section class="auth-col">
        <h2 data-i18n="login">Login</h2>

        <a href="#" class="google-auth">
          <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" alt="Google">
          <span data-i18n="google_login">Login with Google</span>
        </a>

        <form id="loginForm">
          <div class="form-group">
            <label for="login-user"><span data-i18n="username_email">Username or Email</span> <span
                class="required">*</span></label>
            <input type="text" id="login-user" name="username" required>
          </div>

          <div class="form-group">
            <label for="login-pass"><span data-i18n="password">Password</span> <span class="required">*</span></label>
            <div class="password-input-wrapper">
              <input type="password" id="login-pass" name="password" required>
              <button type="button" class="password-toggle" onclick="togglePassword('login-pass')">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <div class="form-group">
            <div class="g-recaptcha" data-sitekey="6LetLZUsAAAAAE8755TKHDvJ6eTUSiN65jRmjf8W"></div>
          </div>

          <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 1rem;">
            <button type="submit" class="btn-auth" data-i18n="login">Login</button>
            <div class="checkbox-group">
              <input type="checkbox" id="remember" name="remember">
              <label for="remember" style="margin: 0; font-weight: 500; color: #666; cursor: pointer;"
                data-i18n="remember_me">Remember me</label>
            </div>
          </div>

          <button type="button" class="lost-password" onclick="openLostPasswordModal()"
            style="background:none; border:none; padding:0; text-align:left; cursor:pointer;"
            data-i18n="lost_password">Lost password?</button>
        </form>
      </section>

      <div class="auth-divider"></div>

      <!-- Register Column -->
      <section class="auth-col">
        <h2 data-i18n="register">Register</h2>

        <form id="registerForm">
          <div class="form-group">
            <label for="reg-username"><span data-i18n="username">Username</span> <span class="required">*</span></label>
            <input type="text" id="reg-username" name="username" required>
          </div>

          <div class="form-group">
            <label for="reg-email"><span data-i18n="email">Email Address</span> <span class="required">*</span></label>
            <input type="email" id="reg-email" name="email" required>
          </div>

          <div class="form-group">
            <label for="reg-pass"><span data-i18n="password">Password</span> <span class="required">*</span></label>
            <div class="password-input-wrapper">
              <input type="password" id="reg-pass" name="password" required>
              <button type="button" class="password-toggle" onclick="togglePassword('reg-pass')">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <div class="form-group">
            <div class="g-recaptcha" data-sitekey="6LetLZUsAAAAAE8755TKHDvJ6eTUSiN65jRmjf8W"></div>
          </div>

          <button type="submit" class="btn-auth" data-i18n="register">Register</button>
        </form>
      </section>
    </div>
  </main>

  <div id="footer-root"></div>

  <!-- Lost Password Modal -->
  <div id="lostPasswordModal" class="modal-overlay">
    <div class="modal-content">
      <button class="modal-close" onclick="closeLostPasswordModal()">&times;</button>

      <!-- Step 1: Email Input -->
      <div id="resetStep1">
        <h3 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem;" data-i18n="reset_password">Reset
          Password</h3>
        <p style="color: #666; font-size: 0.9rem; margin-bottom: 2rem;" data-i18n="reset_desc">Enter your email address
          and we'll send you a link to reset your password.</p>
        <form id="forgotForm">
          <div class="form-group">
            <label data-i18n="email">Email Address</label>
            <input type="email" id="forgot-email" required placeholder="name@company.com">
          </div>
          <div class="form-group">
            <div class="g-recaptcha" data-sitekey="6LetLZUsAAAAAE8755TKHDvJ6eTUSiN65jRmjf8W"></div>
          </div>
          <button type="submit" class="btn-auth" style="width: 100%;" data-i18n="send_reset_link">Send Reset
            Link</button>
        </form>
      </div>

      <!-- Step 2: Confirmation -->
      <div id="resetStep2" style="display: none; text-align: center;">
        <div style="font-size: 3rem; margin-bottom: 1rem;">📧</div>
        <h3 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem;" data-i18n="check_email">Check your
          email!</h3>
        <p style="color: #666; font-size: 0.9rem; margin-bottom: 2rem;">We've sent a recovery link to your inbox.</p>

      </div>

      <!-- Step 3: New Password Input -->
      <div id="resetStep3" style="display: none;">
        <h3 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 1.5rem;" data-i18n="update_password">Update
          Password</h3>
        <form id="newPassForm">
          <div class="form-group">
            <label data-i18n="new_password">New Password</label>
            <input type="password" id="reset-new-pass" required minlength="6">
          </div>
          <div class="form-group">
            <label data-i18n="confirm_new_password">Confirm New Password</label>
            <input type="password" id="reset-confirm-pass" required minlength="6">
          </div>
          <button type="submit" class="btn-auth" style="width: 100%;" data-i18n="update_password">Update
            Password</button>
        </form>
      </div>
    </div>
  </div>

  <script src="header-loader.js"></script>
  <script src="ui-improvements.js"></script>
  <script>
    let recaptchaEnabled = false;

    // Fetch config and handle reCAPTCHA visibility
    async function loadConfig() {
      try {
        const response = await fetch('/api/config');
        const config = await response.json();
        recaptchaEnabled = config.recaptchaEnabled;
        
        if (recaptchaEnabled) {
          // Dynamically load reCAPTCHA script
          const script = document.createElement('script');
          script.src = 'https://www.google.com/recaptcha/api.js';
          script.async = true;
          script.defer = true;
          document.head.appendChild(script);
        } else {
          document.querySelectorAll('.g-recaptcha').forEach(el => el.style.display = 'none');
        }
      } catch (err) {
        console.error('Failed to load config:', err);
      }
    }
    loadConfig();

    function togglePassword(id) {
      const input = document.getElementById(id);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    // Modal Control
    function openLostPasswordModal() {
      document.getElementById('lostPasswordModal').style.display = 'flex';
      document.getElementById('resetStep1').style.display = 'block';
      document.getElementById('resetStep2').style.display = 'none';
      document.getElementById('resetStep3').style.display = 'none';
    }
    function closeLostPasswordModal() {
      document.getElementById('lostPasswordModal').style.display = 'none';
      // Clean URL if token was present
      const url = new URL(window.location);
      url.searchParams.delete('token');
      window.history.replaceState({}, '', url);
    }

    // Detect Token in URL
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      if (params.has('token')) {
        document.getElementById('lostPasswordModal').style.display = 'flex';
        document.getElementById('resetStep1').style.display = 'none';
        document.getElementById('resetStep2').style.display = 'none';
        document.getElementById('resetStep3').style.display = 'block';
      }
    });

    // Forgot Password Flow
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('forgot-email').value;
      let recaptchaResponse = null;

      if (recaptchaEnabled) {
        recaptchaResponse = grecaptcha.getResponse(2);
        if (!recaptchaResponse) {
          if (window.showToast) showToast('Please complete the reCAPTCHA', 'error');
          return;
        }
      }

      try {
        const response = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, recaptchaToken: recaptchaResponse })
        });

        if (response.ok) {
          document.getElementById('resetStep1').style.display = 'none';
          document.getElementById('resetStep2').style.display = 'block';
        } else {
          const result = await response.json();
          if (window.showToast) showToast(result.error || 'Error sending reset link', 'error');
        }
      } catch (err) {
        console.error(err);
      }
    });

    document.getElementById('newPassForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const p1 = document.getElementById('reset-new-pass').value;
      const p2 = document.getElementById('reset-confirm-pass').value;
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');

      if (!token) {
        if (window.showToast) showToast('Invalid or missing token', 'error');
        return;
      }

      if (p1 !== p2) {
        if (window.showToast) showToast('Passwords do not match!', 'error');
        return;
      }

      try {
        const response = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password: p1 })
        });

        const result = await response.json();
        if (response.ok) {
          if (window.showToast) {
            const msg = window.translations?.[localStorage.getItem('selectedLanguage') || 'en']?.password_updated || 'Password updated!';
            showToast(msg, 'success');
          }
          setTimeout(closeLostPasswordModal, 1500);
        } else {
          if (window.showToast) showToast(result.error || 'Error resetting password', 'error');
        }
      } catch (err) {
        console.error(err);
      }
    });

    // Login logic
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData.entries());
      
      if (recaptchaEnabled) {
        const recaptchaResponse = grecaptcha.getResponse(0);
        if (!recaptchaResponse) {
          if (window.showToast) showToast('Please complete the reCAPTCHA', 'error');
          return;
        }
        data.recaptchaToken = recaptchaResponse;
      }

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await response.json();
        if (response.ok) {
          localStorage.setItem('authToken', result.token);
          localStorage.setItem('user', JSON.stringify(result.user));

          const msg = window.translations?.[localStorage.getItem('selectedLanguage') || 'en']?.login_success || 'Login successful!';
          if (window.showToast) showToast(msg, 'success');

          window.location.href = 'client-area.html';
        } else {
          const errMsg = result.error || window.translations?.[localStorage.getItem('selectedLanguage') || 'en']?.error_login || 'Login error';
          if (window.showToast) showToast(errMsg, 'error');
        }
      } catch (err) {
        console.error(err);
      }
    });

    // Register logic
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData.entries());

      if (recaptchaEnabled) {
        const recaptchaResponse = grecaptcha.getResponse(1);
        if (!recaptchaResponse) {
          if (window.showToast) showToast('Please complete the reCAPTCHA', 'error');
          return;
        }
        data.recaptchaToken = recaptchaResponse;
      }

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await response.json();
        if (response.ok) {
          localStorage.setItem('authToken', result.token);
          localStorage.setItem('user', JSON.stringify(result.user));

          const msg = window.translations?.[localStorage.getItem('selectedLanguage') || 'en']?.register_success || 'Registration successful!';
          if (window.showToast) showToast(msg, 'success');

          window.location.href = 'client-area.html';
        } else {
          const errMsg = result.error || window.translations?.[localStorage.getItem('selectedLanguage') || 'en']?.error_register || 'Registration error';
          if (window.showToast) showToast(errMsg, 'error');
        }
      } catch (err) {
        console.error(err);
      }
    });
  </script>
</body>

</html>
